[project]
name = "oncall-copilot"
version = "0.1.0"
description = "An on-call incident copilot built on LangChain and Amazon Bedrock."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6",
    "langchain-aws>=1.7",
    "python-dotenv>=1.0",
    "langgraph>=1.2",
    "langsmith>=0.12",

    # dependency for chunking the local runbooks for RAG - external Knowledge Base wouldn't need.
    "langchain-text-splitters>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oncall*"]
