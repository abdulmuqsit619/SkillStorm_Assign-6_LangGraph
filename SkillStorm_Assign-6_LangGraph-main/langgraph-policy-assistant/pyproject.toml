[project]
name = "langgraph-policy-assistant"
version = "0.1.0"
description = "A LangGraph RAG assistant for answering policy questions."
requires-python = ">=3.11"

dependencies = [
    "langchain-core>=1.6",
    "langchain-aws>=1.7",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policy_assistant*"]